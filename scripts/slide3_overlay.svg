
<svg width="604" height="395" viewBox="0 0 604 395" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Flowing background ribbons in cyan/purple -->
  <path d="M 40 200 Q 200 80 400 240 Q 550 360 600 200" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.35" filter="url(#glow3)"/>
  <path d="M 20 280 Q 250 160 480 320 Q 560 380 600 310" fill="none" stroke="#00e599" stroke-width="3" opacity="0.35" filter="url(#glow3)"/>

  <!-- Top-Left Floating AI Microchip Badge -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="55" height="50" rx="10" fill="#0b0e1b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow3)"/>
    <text x="17" y="32" fill="#00f0ff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="1">AI</text>
    <!-- Microchip pins -->
    <line x1="12" y1="0" x2="12" y2="-4" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="27" y1="0" x2="27" y2="-4" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="42" y1="0" x2="42" y2="-4" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="12" y1="50" x2="12" y2="54" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="27" y1="50" x2="27" y2="54" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="42" y1="50" x2="42" y2="54" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>

  <!-- Laptop Screen Overwrite -->
  <rect x="110" y="85" width="220" height="135" rx="3" fill="#090b14" opacity="0.96"/>

  <!-- Laptop Screen Headline -->
  <text x="122" y="115" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800">Your Vision.</text>
  <text x="122" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800">Our Code.</text>
  <text x="122" y="149" fill="#00e599" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800">Real Growth.</text>

  <!-- Rising Metric Chart on Laptop -->
  <g transform="translate(195, 105)">
    <rect x="0" y="0" width="125" height="98" rx="6" fill="#0f1322" stroke="rgba(255,255,255,0.08)"/>
    <line x1="10" y1="80" x2="115" y2="80" stroke="#334155" stroke-width="1"/>
    <!-- Bars -->
    <rect x="18" y="60" width="8" height="20" rx="2" fill="#3b82f6" opacity="0.7"/>
    <rect x="34" y="50" width="8" height="30" rx="2" fill="#8b5cf6" opacity="0.7"/>
    <rect x="50" y="40" width="8" height="40" rx="2" fill="#a855f7" opacity="0.7"/>
    <rect x="66" y="30" width="8" height="50" rx="2" fill="#00e599" opacity="0.8"/>
    <rect x="82" y="18" width="8" height="62" rx="2" fill="#00e599"/>
    <!-- Rising Trend Line -->
    <path d="M 22 55 Q 40 45 54 35 T 86 15 L 102 8" fill="none" stroke="#00e599" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Glow Arrow -->
    <polygon points="102,8 94,10 98,16" fill="#00e599"/>
  </g>

  <!-- Smartphone Screen Overwrite -->
  <rect x="350" y="145" width="85" height="150" rx="10" fill="#080a12" opacity="0.96"/>
  <rect x="375" y="148" width="30" height="3" rx="1.5" fill="#334155"/>
  <text x="358" y="172" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800">Better Systems.</text>
  <text x="358" y="186" fill="#00e599" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800">Bigger</text>
  <text x="358" y="200" fill="#00e599" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800">Opportunities.</text>

  <!-- Glowing Circular Portal on Phone -->
  <circle cx="392" cy="245" r="22" fill="#09101c" stroke="#00e599" stroke-width="1.5"/>
  <circle cx="392" cy="245" r="14" fill="#0b172a" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M 387 245 L 397 245 M 392 240 L 392 250" stroke="#00f0ff" stroke-width="2"/>

  <!-- Right Floating Vertical Menu Card -->
  <g transform="translate(445, 30)">
    <rect x="0" y="0" width="145" height="195" rx="12" fill="#0a0d18" stroke="#8b5cf6" stroke-width="1.2" filter="url(#glow3)" opacity="0.95"/>
    
    <!-- Menu item 1: Websites -->
    <g transform="translate(14, 18)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#141829" stroke="#00e599" stroke-width="1"/>
      <circle cx="9" cy="9" r="5" fill="none" stroke="#00e599" stroke-width="1"/>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600">Websites</text>
    </g>

    <!-- Menu item 2: Automation -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#141829" stroke="#00e599" stroke-width="1"/>
      <path d="M 5 9 L 9 5 L 13 9 L 9 13 Z" fill="#00e599"/>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600">Automation</text>
    </g>

    <!-- Menu item 3: Social Media -->
    <g transform="translate(14, 78)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#141829" stroke="#00e599" stroke-width="1"/>
      <circle cx="9" cy="9" r="4" fill="#00e599"/>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600">Social Media</text>
    </g>

    <!-- Menu item 4: SMS -->
    <g transform="translate(14, 108)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#141829" stroke="#00e599" stroke-width="1"/>
      <rect x="4" y="5" width="10" height="8" rx="2" fill="none" stroke="#00e599" stroke-width="1"/>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600">SMS</text>
    </g>

    <!-- Menu item 5: Client Portal -->
    <g transform="translate(14, 138)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#141829" stroke="#00e599" stroke-width="1"/>
      <circle cx="9" cy="7" r="3" fill="#00e599"/>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600">Client Portal</text>
    </g>

    <!-- Menu item 6: Usabime -->
    <g transform="translate(14, 168)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#141829" stroke="#00e599" stroke-width="1"/>
      <path d="M 6 12 L 9 6 L 12 12" fill="none" stroke="#00e599" stroke-width="1.5"/>
      <text x="26" y="13" fill="#00e599" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700">Usabime</text>
    </g>
  </g>
</svg>
