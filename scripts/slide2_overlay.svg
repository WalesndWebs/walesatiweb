
<svg width="604" height="395" viewBox="0 0 604 395" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient green curve backlighting on right -->
  <path d="M 440 380 Q 520 200 480 80 Q 450 10 520 0" fill="none" stroke="#00e599" stroke-width="4" opacity="0.35" filter="url(#glow)"/>
  <path d="M 450 390 Q 550 220 500 100" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.4" filter="url(#glow)"/>

  <!-- Laptop Screen Overwrite -->
  <rect x="110" y="85" width="220" height="135" rx="3" fill="#090b14" opacity="0.96"/>
  
  <!-- Laptop Screen Logo -->
  <path d="M 125 100 L 130 112 L 134 105 L 138 112 L 143 100" stroke="#00f0ff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="148" y="107" fill="#64748b" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="700">WALES &amp; WEBS</text>
  
  <!-- Laptop Screen Headline -->
  <text x="125" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800">Your Vision.</text>
  <text x="125" y="150" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800">Our Code.</text>
  <text x="125" y="168" fill="#00e599" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800">Real Growth.</text>

  <!-- Laptop Right Preview Card -->
  <rect x="240" y="105" width="80" height="100" rx="6" fill="#131728" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9"/>
  <rect x="248" y="115" width="40" height="6" rx="3" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="280" cy="155" r="18" fill="none" stroke="#00e599" stroke-width="2"/>
  <path d="M 272 155 L 278 160 L 288 150" fill="none" stroke="#00e599" stroke-width="2"/>

  <!-- Floating Badge 1: Top Left "Websites that work." -->
  <g transform="translate(25, 30)">
    <rect x="0" y="0" width="118" height="38" rx="8" fill="#0d101d" stroke="#8b5cf6" stroke-width="1.2" filter="url(#glow)" opacity="0.95"/>
    <circle cx="20" cy="19" r="9" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
    <path d="M 14 19 Q 20 13 26 19 Q 20 25 14 19 M 20 10 L 20 28" fill="none" stroke="#c084fc" stroke-width="1"/>
    <text x="36" y="17" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700">Websites</text>
    <text x="36" y="27" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8">that work.</text>
  </g>

  <!-- Floating Badge 2: Top Right "Automation that saves time." -->
  <g transform="translate(435, 60)">
    <rect x="0" y="0" width="138" height="38" rx="8" fill="#0d101d" stroke="#8b5cf6" stroke-width="1.2" filter="url(#glow)" opacity="0.95"/>
    <circle cx="20" cy="19" r="9" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
    <path d="M 21 13 L 16 19 L 20 19 L 19 25 L 24 18 L 20 18 Z" fill="#c084fc"/>
    <text x="36" y="17" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700">Automation</text>
    <text x="36" y="27" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8">that saves time.</text>
  </g>

  <!-- Floating Badge 3: Middle Right "Growth that lasts." -->
  <g transform="translate(460, 145)">
    <rect x="0" y="0" width="128" height="38" rx="8" fill="#0d101d" stroke="#00e599" stroke-width="1.2" filter="url(#glow)" opacity="0.95"/>
    <circle cx="20" cy="19" r="9" fill="#064e3b" stroke="#00e599" stroke-width="1"/>
    <path d="M 15 22 L 18 19 L 21 21 L 25 15" fill="none" stroke="#00e599" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36" y="17" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700">Growth</text>
    <text x="36" y="27" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8">that lasts.</text>
  </g>

  <!-- Smartphone Screen Overwrite -->
  <rect x="350" y="145" width="85" height="150" rx="10" fill="#080a12" opacity="0.96"/>
  <rect x="375" y="148" width="30" height="3" rx="1.5" fill="#334155"/>
  <text x="358" y="175" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800">Build.</text>
  <text x="358" y="190" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800">Brand.</text>
  <text x="358" y="205" fill="#a78bfa" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800">Engage.</text>
  <text x="358" y="220" fill="#00e599" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800">Grow.</text>
  
  <!-- Smartphone Graphic Card -->
  <rect x="356" y="235" width="72" height="46" rx="6" fill="#131626" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="376" cy="258" r="10" fill="#8b5cf6" opacity="0.4"/>
</svg>
